<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatSphere</title>
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>
    <div class="chat-layout">

        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">U</div>
                <div class="user-details">
                    <h3 id="username">Username</h3>
                    <p id="status">Online</p>
                </div>
            </div>
            <div class="sidebar-actions">
                <button id="logout-btn">
                   <i data-lucide="log-out"></i>
                </button>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="conversation-search" placeholder="Search conversations...">
        </div>
        <div class="conversation-list" id="conversation-list">
        </div>
        <button id="new-conversation-btn">
            <i data-lucide="plus"></i>
        </button>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-info">
                    <button type="button" id="back-to-conversations" class="mobile-back-btn"aria-label="Back to conversations">
                        <i data-lucide="arrow-left"></i>
                    </button>
                    <div class="chat-avatar" id="chat-avatar">
                        A
                    </div>

                    <div class="chat-details">
                        <h2 id="chat-name">Select a Conversation</h2>
                        <p id="chat-status">No conversation selected</p>
                    </div>
                </div>
                <div class="chat-actions">
                    <button id="add-member-btn" class="add-member hidden">
                        <i data-lucide="user-plus"></i>
                    </button>
                    <button type="button" id="chat-menu-btn" class="hidden">
                        <i data-lucide="ellipsis-vertical"></i>
                    </button>
                </div>
            </div>
            <div class="messages-container" id="messages-container">
                <div class="empty-chat" id="empty-chat">
                    <div class="empty-chat-icon">
                        💬
                    </div>
                    <h2>Select a Conversation</h2>
                    <p>
                        Choose a conversation from the sidebar
                        or create a new one.
                    </p>
                </div>
            </div>
            <div class="message-input-container">
                <div class="message-input-wrapper">
                    <button type="button" id="attach-image-btn" title="Attach image">
                        <i data-lucide="image"></i>
                    </button>
                    <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" class="hidden">
                    <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
                    <button type="button" id="send-message-btn">
                        <i data-lucide="send"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-menu" class="chat-menu hidden">
        <button id="group-info-option"><i data-lucide="users"></i></i>Group Info</button>
        <button id="rename-group-option"><i data-lucide="pencil"></i>Rename Group</button>
        <button id="add-member-option" class="add-member"><i data-lucide="user-plus"></i>Add Member</button>
        <button id="leave-group-option" class="danger"><i data-lucide="log-out"></i>Leave Group</button>
        <button id="delete-conversation-option" class="danger"><i data-lucide="trash-2"></i>Delete Conversation</button>
    </div>

    <div id="new-conversation-modal" class="modal hidden">
        <div class="modal-content">
            <h2>New Conversation</h2>
            <div class="conversation-type">
                <label>
                    <input
                        type="radio"
                        name="conversation-type"
                        value="private"
                        checked
                    >
                    Private Chat
                </label>
                <label>
                    <input
                        type="radio"
                        name="conversation-type"
                        value="group"
                    >
                    Group Chat
                </label>
            </div>
            <div id="group-name-container" class="hidden">
                <input
                    id="group-name"
                    placeholder="Group Name"
                >
            </div>
            <input
                id="user-search"
                class="modal-search"
                placeholder="Search user..."
                
            >
            <div id="users-list" class="users-list"></div>
            
            <div class="modal-actions">
                <button id="cancel-new-chat-btn" class="cancel-btn">
                    Cancel
                </button>
                <button id="create-conversation-btn" class="primary-btn" disabled>
                    Create
                </button>
            </div>
        </div>
    </div>

    <div id="add-members-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Add Members</h2>
            <input
                id="member-search"
                class="modal-search"
                placeholder="Search users..."
            >
            <div id="available-users-list" class="users-list"></div>
            <div class="modal-actions">
                <button id="cancel-add-members-btn" class="cancel-btn">
                    Cancel
                </button>
                <button id="confirm-add-members-btn" class="primary-btn" disabled>
                    Add Members
                </button>
            </div>
        </div>
    </div>

    <div id="group-info-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Group Info</h2>
            <div class="group-info-content" id="group-info-content">

            </div>
            <div class="modal-actions">
                <button id="close-group-info-btn">Close</button>
            </div>
        </div>
    </div>

    <div id="rename-group-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Change Group Name</h3>
            <input
                type="text"
                id="group-rename-input"
                class="group-rename-input"

                maxlength="100"
                placeholder="Enter group name"
            >
            <div class="modal-actions">
                <button id="cancel-group-rename-btn">Cancel</button>
                <button id="save-group-rename-btn">Save</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
